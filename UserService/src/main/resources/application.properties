# ====================================================================
# UserService Application Properties (Local & Cloud / Render)
# ====================================================================

# Port configuration: Render provides $PORT (default to 8081 locally)
server.port=${PORT:8081}

# Database Configuration (MySQL / Aiven Cloud)
# Format for Aiven: jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/reglogin?sslMode=REQUIRED
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reglogin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
# Include localhost:3036 for local dev and your Vercel URL for production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3036}

# Logging (Never log sensitive credentials or plain passwords)
logging.level.org.springframework.web=INFO
logging.level.com.example.userservice=INFO
