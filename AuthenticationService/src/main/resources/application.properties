server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:reglogindb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:4c9f1b8a7d3e6f2c0b5e8a1d4f7c9b2e5a8d1f4c7b0e3a6d9f2c5b8e1a4d7f0c}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=${JWT_COOKIE_NAME:jwt_token}
jwt.cookie-secure=false
jwt.cookie-samesite=Lax

cors.allowed-origins=https://frontend-registration-login.vercel.app,http://localhost:3000,http://localhost:3036

logging.level.org.springframework.web=INFO
