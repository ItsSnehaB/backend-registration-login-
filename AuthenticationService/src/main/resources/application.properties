# ====================================================================
# AuthenticationService Application Properties (Local & Cloud / Render)
# ====================================================================

# Port configuration: Render provides $PORT (default to 8082 locally)
server.port=${PORT:8082}

# Database Configuration (MySQL / Aiven Cloud)
# Format for Aiven: jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/reglogin?sslMode=REQUIRED
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reglogin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Externalized & Configurable)
# Must be at least 256 bits (32 bytes / 64 hex characters) for HMAC-SHA256
jwt.secret=${JWT_SECRET:4c9f1b8a7d3e6f2c0b5e8a1d4f7c9b2e5a8d1f4c7b0e3a6d9f2c5b8e1a4d7f0c}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=${JWT_COOKIE_NAME:jwt_token}

# In Production over HTTPS: Secure=true and SameSite=None are required for cross-origin cookies between Vercel and Render
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
jwt.cookie-samesite=${JWT_COOKIE_SAMESITE:None}

# CORS Configuration
# Include localhost:3036 for local dev and your Vercel URL for production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3036}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.authservice=INFO
