# ====================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Services: user-service & auth-service
# Database: Aiven for MySQL (Cloud hosted with TLS/SSL)
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. UserService (Microservice handling user registration)
  # ------------------------------------------------------------------
  - type: web
    name: reglogin-user-service
    runtime: docker
    dockerfilePath: ./UserService/Dockerfile
    dockerContext: ./UserService
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Aiven MySQL JDBC Connection String
      # Format: jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/<DATABASE_NAME>?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3036,https://*.vercel.app

  # ------------------------------------------------------------------
  # 2. AuthenticationService (Microservice handling login & JWT HttpOnly cookies)
  # ------------------------------------------------------------------
  - type: web
    name: reglogin-auth-service
    runtime: docker
    dockerfilePath: ./AuthenticationService/Dockerfile
    dockerContext: ./AuthenticationService
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Aiven MySQL Connection
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Production 256-bit JWT Signing Key (Auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: JWT_COOKIE_NAME
        value: jwt_token
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAMESITE
        value: None
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3036,https://*.vercel.app
